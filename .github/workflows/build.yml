name: Build

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      browseros_version:
        description: BrowserOS neo version to build (e.g. 0.51.1.2). Empty means latest.
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Resolve BrowserOS neo release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-release.sh "${{ inputs.browseros_version }}" | tee -a "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether to publish
        id: plan
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          publish=false
          case "$EVENT" in
            push|workflow_dispatch)
              [ "$REF" = "refs/heads/main" ] && publish=true
              ;;
            schedule)
              if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
                echo "$IMAGE:$VERSION already exists; nothing to do."
              else
                publish=true
              fi
              ;;
          esac
          build=true
          if [ "$EVENT" = "schedule" ] && [ "$publish" = "false" ]; then
            build=false
          fi
          echo "publish=$publish" | tee -a "$GITHUB_OUTPUT"
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.plan.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: steps.plan.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: browseros-neo:test
          build-args: |
            BROWSEROS_VERSION=${{ steps.release.outputs.version }}
            BROWSEROS_SHA256=${{ steps.release.outputs.sha256 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.plan.outputs.build == 'true'
        run: ./tests/smoke.sh browseros-neo:test

      - name: Generate Docker metadata
        if: steps.plan.outputs.publish == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.browseros_version == '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Publish image
        if: steps.plan.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BROWSEROS_VERSION=${{ steps.release.outputs.version }}
            BROWSEROS_SHA256=${{ steps.release.outputs.sha256 }}
          cache-from: type=gha
